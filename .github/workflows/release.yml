name: Release

env:
  LEXBOR_VERSION: v2.6.0
  REBAR3_VERSION: '3.22'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish to Hex.pm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Verify tag matches VERSION and app.src
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        FILE_VERSION=$(tr -d '[:space:]' < VERSION)
        APP_VERSION=$(awk -F'"' '/{vsn,/ {print $2; exit}' src/lexbor_erl.app.src)
        echo "tag=${TAG_VERSION} VERSION=${FILE_VERSION} app.src=${APP_VERSION}"
        if [ "$TAG_VERSION" != "$FILE_VERSION" ] || [ "$TAG_VERSION" != "$APP_VERSION" ]; then
          echo "::error::Version mismatch: tag v${TAG_VERSION} must equal VERSION (${FILE_VERSION}) and app.src vsn (${APP_VERSION})"
          exit 1
        fi

    - name: Verify tag commit is on main
      run: |
        git fetch origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Tag ${GITHUB_REF_NAME} is not on origin/main"
          exit 1
        fi

    - name: Set up Erlang/OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27.0'
        rebar3-version: ${{ env.REBAR3_VERSION }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential git

    - name: Install lexbor library
      run: |
        git clone --depth 1 --branch ${{ env.LEXBOR_VERSION }} https://github.com/lexbor/lexbor.git /tmp/lexbor
        cd /tmp/lexbor
        cmake -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build
        sudo cmake --install build
        sudo ldconfig

    - name: Compile
      run: make compile

    - name: Run C unit tests
      run: make test-c

    - name: Run Erlang tests
      run: make test

    - name: Publish to Hex.pm
      env:
        HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      run: |
        if [ -z "$HEX_API_KEY" ]; then
          echo "::error::HEX_API_KEY secret is not set"
          exit 1
        fi
        # rebar3_hex publish_branch requires branch name "main"
        git checkout -B main
        rebar3 hex publish --yes
